  - { slot: tripurasundari, layer: dasa-disa, label_sa: त्रिपुरसुन्दरी (षोडशी), label_iast: Tripurasundarī (Ṣoḍaśī), label_hi: त्रिपुरसुन्दरी (षोडशी), label_en: Tripurasundarī (Ṣoḍaśī), href: /devata/tripurasundari/, status: in-preparation }
  - { slot: bhuvanesvari, layer: dasa-disa, label_sa: भुवनेश्वरी, label_iast: Bhuvaneśvarī, label_hi: भुवनेश्वरी, label_en: Bhuvaneśvarī, href: /devata/bhuvanesvari/, status: in-preparation }
  - { slot: bhairavi, layer: dasa-disa, label_sa: भैरवी, label_iast: Bhairavī, label_hi: भैरवी, label_en: Bhairavī, href: /devata/bhairavi/, status: in-preparation }
  - { slot: chinnamasta, layer: dasa-disa, label_sa: छिन्नमस्ता, label_iast: Chinnamastā, label_hi: छिन्नमस्ता, label_en: Chinnamastā, href: /devata/chinnamasta/, status: in-preparation }
  - { slot: dhumavati, layer: dasa-disa, label_sa: धूमावती, label_iast: Dhūmāvatī, label_hi: धूमावती, label_en: Dhūmāvatī, href: /devata/dhumavati/, status: in-preparation }
  - { slot: bagalamukhi, layer: dasa-disa, label_sa: बगलामुखी, label_iast: Bagalāmukhī, label_hi: बगलामुखी, label_en: Bagalāmukhī, href: /devata/bagalamukhi/, status: in-preparation }
  - { slot: matangi, layer: dasa-disa, label_sa: मातङ्गी, label_iast: Mātaṅgī, label_hi: मातङ्गी, label_en: Mātaṅgī, href: /devata/matangi/, status: in-preparation }
  - { slot: kamala, layer: dasa-disa, label_sa: कमला (कमलात्मिका), label_iast: Kamalā (Kamalātmikā), label_hi: कमला (कमलात्मिका), label_en: Kamalā (Kamalātmikā), href: /devata/kamala/, status: in-preparation }

